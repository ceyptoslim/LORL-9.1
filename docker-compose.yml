version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LORL_DB_URL=postgresql://lorl:lorl_dev@db:5432/lorl_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lorl
      POSTGRES_PASSWORD: lorl_dev
      POSTGRES_DB: lorl_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorl"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

volumes:
  pgdata:
