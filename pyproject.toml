[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lorl"
version = "0.1.0"
description = "LORL-9.1: Event-sourced institutional intelligence OS with Ed25519 identity, PostgreSQL ledger, treaty engine, and CUSTOS-Core governance integration."
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
authors = [{name = "ceyptoslim"}]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

markers = [
    "integration: marks tests that require external services",
]
